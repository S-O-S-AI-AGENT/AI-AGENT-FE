apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-agent-fe-ingress
  namespace: ai-agent-fe
  annotations:
    # Example for nginx ingress controller
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: example.app.domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-agent-fe
                port:
                  number: 80
  # TLS section (enable and reference secret if you have TLS certs)
  # tls:
  #   - hosts:
  #       - example.app.domain
  #     secretName: tls-secret
