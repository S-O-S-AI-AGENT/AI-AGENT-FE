apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-deployment
  labels:
    app: ai-agent-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-fe
  template:
    metadata:
      labels:
        app: ai-agent-fe
    spec:
      containers:
        - name: ai-agent
          image: sos-reg.kr.ncr.ntruss.com/ai-agent-fe:latest
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
