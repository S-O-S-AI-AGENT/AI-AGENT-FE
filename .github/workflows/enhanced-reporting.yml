name: Enhanced Test Reporting & Notifications

on:
  workflow_run:
    workflows: ["Automated Testing with TestFlight"]
    types:
      - completed

jobs:
  process-test-results:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts from workflow run
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }},
            });

            for (const artifact of artifacts.data.artifacts) {
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
                archive_format: 'zip',
              });
              
              const fs = require('fs');
              fs.writeFileSync(`${artifact.name}.zip`, Buffer.from(download.data));
            }

      - name: Extract and process test results
        run: |
          # 아티팩트 압축 해제
          if [ -f "playwright-report.zip" ]; then
            unzip -q playwright-report.zip -d ./test-results/
          fi

          if [ -f "test-videos.zip" ]; then
            unzip -q test-videos.zip -d ./test-videos/
          fi

          # 테스트 결과 파싱
          echo "Processing test results..."

          # JSON 결과 파일이 있는지 확인
          if [ -f "./test-results/results.json" ]; then
            echo "Found test results file"
            
            # jq를 사용해 결과 파싱
            TOTAL_TESTS=$(jq '.suites | map(.tests | length) | add // 0' ./test-results/results.json)
            PASSED_TESTS=$(jq '[.suites[].tests[] | select(.status == "passed")] | length' ./test-results/results.json)
            FAILED_TESTS=$(jq '[.suites[].tests[] | select(.status == "failed")] | length' ./test-results/results.json)
            SKIPPED_TESTS=$(jq '[.suites[].tests[] | select(.status == "skipped")] | length' ./test-results/results.json)
            
            echo "TOTAL_TESTS=$TOTAL_TESTS" >> $GITHUB_ENV
            echo "PASSED_TESTS=$PASSED_TESTS" >> $GITHUB_ENV
            echo "FAILED_TESTS=$FAILED_TESTS" >> $GITHUB_ENV
            echo "SKIPPED_TESTS=$SKIPPED_TESTS" >> $GITHUB_ENV
            
            # 성공률 계산
            if [ "$TOTAL_TESTS" -gt 0 ]; then
              SUCCESS_RATE=$((PASSED_TESTS * 100 / TOTAL_TESTS))
              echo "SUCCESS_RATE=$SUCCESS_RATE" >> $GITHUB_ENV
            else
              echo "SUCCESS_RATE=0" >> $GITHUB_ENV
            fi
            
            # 실패한 테스트 상세 정보 추출
            jq -r '.suites[].tests[] | select(.status == "failed") | "- \(.title): \(.status)"' ./test-results/results.json > failed_tests.txt || echo "No failed tests" > failed_tests.txt
            
            # 성능 메트릭 추출 (있다면)
            if [ -f "./test-results/lighthouse-results.json" ]; then
              echo "Found performance metrics"
              # Lighthouse 결과 처리
            fi
          else
            echo "No test results found"
            echo "TOTAL_TESTS=0" >> $GITHUB_ENV
            echo "PASSED_TESTS=0" >> $GITHUB_ENV
            echo "FAILED_TESTS=0" >> $GITHUB_ENV
            echo "SKIPPED_TESTS=0" >> $GITHUB_ENV
            echo "SUCCESS_RATE=0" >> $GITHUB_ENV
          fi

      - name: Generate enhanced test report
        id: report
        run: |
          # 기본 정보 설정
          echo "REPORT_DATE=$(date '+%Y-%m-%d %H:%M:%S KST')" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "FULL_COMMIT_SHA=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "WORKFLOW_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          echo "GITHUB_REPO_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

          # 배지 색상 결정
          if [ "$FAILED_TESTS" -eq 0 ]; then
            echo "BADGE_COLOR=brightgreen" >> $GITHUB_OUTPUT
            echo "TESTFLIGHT_COLOR=blue" >> $GITHUB_OUTPUT
          elif [ "$PASSED_TESTS" -gt "$FAILED_TESTS" ]; then
            echo "BADGE_COLOR=yellow" >> $GITHUB_OUTPUT
            echo "TESTFLIGHT_COLOR=orange" >> $GITHUB_OUTPUT
          else
            echo "BADGE_COLOR=red" >> $GITHUB_OUTPUT
            echo "TESTFLIGHT_COLOR=red" >> $GITHUB_OUTPUT
          fi

          # TestFlight 상태
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "IS_MAIN_BRANCH=true" >> $GITHUB_OUTPUT
            echo "TESTFLIGHT_STATUS=deployed" >> $GITHUB_OUTPUT
          else
            echo "IS_MAIN_BRANCH=false" >> $GITHUB_OUTPUT
            echo "TESTFLIGHT_STATUS=skipped" >> $GITHUB_OUTPUT
          fi

          # 실패한 테스트 상세 정보
          if [ -f "failed_tests.txt" ]; then
            FAILED_DETAILS=$(cat failed_tests.txt)
            echo "FAILED_TESTS_DETAILS<<EOF" >> $GITHUB_OUTPUT
            echo "$FAILED_DETAILS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create detailed GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 이슈 템플릿 읽기
            let issueTemplate = '';
            try {
              issueTemplate = fs.readFileSync('.github/templates/issue-template.md', 'utf8');
            } catch (error) {
              console.log('Template not found, using default');
              issueTemplate = `# 🤖 자동 테스트 결과 리포트
              
              **실행 일시:** ${{ steps.report.outputs.REPORT_DATE }}
              **커밋:** \`${{ steps.report.outputs.COMMIT_SHA }}\`
              **워크플로우:** [${{ github.event.workflow_run.id }}](${{ steps.report.outputs.WORKFLOW_URL }})
              
              ## 📊 테스트 결과
              - ✅ **통과:** ${process.env.PASSED_TESTS}개
              - ❌ **실패:** ${process.env.FAILED_TESTS}개
              - ⏭️ **건너뜀:** ${process.env.SKIPPED_TESTS}개
              - 📊 **성공률:** ${process.env.SUCCESS_RATE}%
              
              ## 🎯 TestFlight 배포
              ${'${{ steps.report.outputs.IS_MAIN_BRANCH }}' === 'true' ? '✅ TestFlight에 새 빌드가 업로드되었습니다.' : '⏭️ main 브랜치가 아니므로 TestFlight 배포를 건너뛰었습니다.'}
              
              ## 📹 테스트 영상
              테스트 실행 중 기록된 영상들은 [Artifacts](${{ steps.report.outputs.WORKFLOW_URL }})에서 다운로드할 수 있습니다.
              
              ---
              *이 이슈는 자동으로 생성되었습니다.*`;
            }

            // 템플릿 변수 치환
            const processedTemplate = issueTemplate
              .replace(/\{\{REPORT_DATE\}\}/g, '${{ steps.report.outputs.REPORT_DATE }}')
              .replace(/\{\{COMMIT_SHA\}\}/g, '${{ steps.report.outputs.COMMIT_SHA }}')
              .replace(/\{\{FULL_COMMIT_SHA\}\}/g, '${{ steps.report.outputs.FULL_COMMIT_SHA }}')
              .replace(/\{\{WORKFLOW_URL\}\}/g, '${{ steps.report.outputs.WORKFLOW_URL }}')
              .replace(/\{\{GITHUB_REPO_URL\}\}/g, '${{ steps.report.outputs.GITHUB_REPO_URL }}')
              .replace(/\{\{BRANCH_NAME\}\}/g, '${{ steps.report.outputs.BRANCH_NAME }}')
              .replace(/\{\{TESTS_PASSED\}\}/g, process.env.PASSED_TESTS)
              .replace(/\{\{TESTS_FAILED\}\}/g, process.env.FAILED_TESTS)
              .replace(/\{\{SUCCESS_RATE\}\}/g, process.env.SUCCESS_RATE)
              .replace(/\{\{BADGE_COLOR\}\}/g, '${{ steps.report.outputs.BADGE_COLOR }}')
              .replace(/\{\{TESTFLIGHT_STATUS\}\}/g, '${{ steps.report.outputs.TESTFLIGHT_STATUS }}')
              .replace(/\{\{TESTFLIGHT_COLOR\}\}/g, '${{ steps.report.outputs.TESTFLIGHT_COLOR }}');

            const issueTitle = `🤖 자동 테스트 결과 - ${new Date().toLocaleDateString('ko-KR')} (${process.env.SUCCESS_RATE}% 성공)`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: processedTemplate,
              labels: ['automated-test', 'report', process.env.FAILED_TESTS > 0 ? 'test-failure' : 'test-success']
            });

      - name: Send Slack notification (if configured)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Slack 메시지 페이로드 구성
          if [ "$FAILED_TESTS" -eq 0 ]; then
            COLOR="good"
            STATUS_EMOJI="✅"
          else
            COLOR="danger"
            STATUS_EMOJI="❌"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "$COLOR",
                "title": "$STATUS_EMOJI AI Project Agent - 테스트 결과",
                "fields": [
                  {
                    "title": "성공률",
                    "value": "${SUCCESS_RATE}%",
                    "short": true
                  },
                  {
                    "title": "통과/실패",
                    "value": "${PASSED_TESTS}/${FAILED_TESTS}",
                    "short": true
                  },
                  {
                    "title": "커밋",
                    "value": "<${{ steps.report.outputs.GITHUB_REPO_URL }}/commit/${{ steps.report.outputs.FULL_COMMIT_SHA }}|${{ steps.report.outputs.COMMIT_SHA }}>",
                    "short": true
                  },
                  {
                    "title": "워크플로우",
                    "value": "<${{ steps.report.outputs.WORKFLOW_URL }}|실행 결과 보기>",
                    "short": true
                  }
                ],
                "footer": "GitHub Actions",
                "ts": $(date +%s)
              }
            ]
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"

      - name: Send enhanced email with HTML template
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🤖 AI Project Agent - 테스트 결과 (${{ env.SUCCESS_RATE }}% 성공)"
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: ${{ secrets.EMAIL_USERNAME }}
          html_body: |
            <!DOCTYPE html>
            <html>
            <!-- HTML 템플릿을 여기에 인라인으로 포함하거나 파일에서 읽어올 수 있습니다 -->
            <body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
              <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; border-radius: 12px 12px 0 0;">
                <h1 style="margin: 0;">🤖 AI Project Agent</h1>
                <p style="margin: 10px 0 0 0; opacity: 0.9;">자동 테스트 결과 리포트</p>
              </div>
              
              <div style="background: white; padding: 30px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                <h2>📊 테스트 결과</h2>
                <div style="display: flex; gap: 20px; margin: 20px 0;">
                  <div style="flex: 1; text-align: center; padding: 15px; background: #d4edda; color: #155724; border-radius: 8px;">
                    <div style="font-size: 32px; font-weight: bold;">${{ env.PASSED_TESTS }}</div>
                    <div style="font-size: 14px;">통과</div>
                  </div>
                  <div style="flex: 1; text-align: center; padding: 15px; background: #f8d7da; color: #721c24; border-radius: 8px;">
                    <div style="font-size: 32px; font-weight: bold;">${{ env.FAILED_TESTS }}</div>
                    <div style="font-size: 14px;">실패</div>
                  </div>
                </div>
                
                <h2>🎯 TestFlight 배포</h2>
                <p>${{ steps.report.outputs.IS_MAIN_BRANCH == 'true' && 'TestFlight에 새 빌드가 업로드되었습니다.' || 'main 브랜치가 아니므로 TestFlight 배포를 건너뛰었습니다.' }}</p>
                
                <div style="margin: 30px 0;">
                  <a href="${{ steps.report.outputs.WORKFLOW_URL }}" style="display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; padding: 15px 20px; border-radius: 8px; font-weight: 600;">📊 워크플로우 결과 보기</a>
                </div>
                
                <p style="color: #6c757d; font-size: 14px; margin-top: 30px;">
                  실행 일시: ${{ steps.report.outputs.REPORT_DATE }}<br>
                  커밋: ${{ steps.report.outputs.COMMIT_SHA }}<br>
                  이 메일은 자동으로 발송되었습니다.
                </p>
              </div>
            </body>
            </html>
          attachments: |
            test-videos/*
            test-results/*.png
