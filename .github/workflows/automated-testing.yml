name: Automated Web Testing & Reporting

on:
  push:
    branches: ["**"] # 모든 브랜치에서 실행
  pull_request:
    branches: ["**"] # 모든 브랜치로의 PR에서 실행
  schedule:
    # 매일 오전 9시 KST (UTC 0시)에 실행
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  web-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate E2E route tests
        run: npm run e2e:generate

      - name: Build application
        run: npm run build

      - name: Run E2E tests with video recording
        run: |
          # Generate HTML report and a deterministic JSON summary file alongside test artifacts
          npx playwright test --reporter=html --output=test-results
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  create-test-report:
    runs-on: ubuntu-latest
    needs: [web-e2e-tests]
    if: always()
    outputs:
      REPORT_DATE: ${{ steps.test-report.outputs.REPORT_DATE }}
      COMMIT_SHA: ${{ steps.test-report.outputs.COMMIT_SHA }}
      WORKFLOW_URL: ${{ steps.test-report.outputs.WORKFLOW_URL }}
      BRANCH_NAME: ${{ steps.test-report.outputs.BRANCH_NAME }}
      TESTS_PASSED: ${{ steps.test-report.outputs.TESTS_PASSED }}
      TESTS_FAILED: ${{ steps.test-report.outputs.TESTS_FAILED }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: ./test-results

      - name: Ensure jq is installed
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      # Videos are included in the 'playwright-report' artifact under test-results/

      - name: Generate test report
        id: test-report
        run: |
          echo "REPORT_DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "WORKFLOW_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

          # 테스트 결과 파싱 (HTML 리포트 통계 활용)
          HTML_SUMMARY="./test-results/playwright-report/data/report.json"
          if [ -f "$HTML_SUMMARY" ]; then
            PASSED=$(jq -r '.stats.expected // 0' "$HTML_SUMMARY")
            FAILED=$(jq -r '.stats.unexpected // 0' "$HTML_SUMMARY")
          else
            PASSED=0
            FAILED=0
          fi

          echo "TESTS_PASSED=$PASSED" >> $GITHUB_OUTPUT
          echo "TESTS_FAILED=$FAILED" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Issue for Test Results
        uses: actions/github-script@v7
        env:
          ISSUE_ASSIGNEES: ${{ secrets.ISSUE_ASSIGNEES }}
        with:
          script: |
            const branch = `${{ steps.test-report.outputs.BRANCH_NAME }}`;
            const passed = Number(`${{ steps.test-report.outputs.TESTS_PASSED }}` || 0);
            const failed = Number(`${{ steps.test-report.outputs.TESTS_FAILED }}` || 0);
            const hasFailure = failed > 0;

            const title = `🤖 자동 테스트 결과 - ${branch}`;
            const body = `
            # 🤖 자동 테스트 결과 리포트 (${branch})

            **실행 일시:** ${{ steps.test-report.outputs.REPORT_DATE }}  
            **브랜치:** \\`${branch}\\`  
            **커밋:** \\`${{ steps.test-report.outputs.COMMIT_SHA }}\\`  
            **워크플로우:** [링크](${{ steps.test-report.outputs.WORKFLOW_URL }})

            ## 📊 테스트 결과
            - ✅ **통과:** ${passed}개
            - ❌ **실패:** ${failed}개

            ## 🌐 웹 애플리케이션 테스트
            자동화된 E2E 테스트가 완료되었습니다.

            ## 📹 테스트 영상
            테스트 실행 중 기록된 영상과 리포트는 해당 워크플로우의 Artifacts에서 확인할 수 있습니다.

            ## 🔗 관련 링크
            - [워크플로우 실행 결과](${{ steps.test-report.outputs.WORKFLOW_URL }})

            ---
            *이 이슈는 GitHub Actions에 의해 자동으로 생성/업데이트되었습니다.*
            `;

            // parse assignees
            const assigneesStr = process.env.ISSUE_ASSIGNEES || '';
            const assignees = assigneesStr
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            // find existing open issue with same title
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title === title);

            const labels = ['automated-test', 'report', hasFailure ? 'test-failure' : 'test-success'];

            if (existing) {
              // update body and add a run comment
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `새 워크플로우 실행 결과: ${hasFailure ? '❌ 실패 있음' : '✅ 모든 테스트 통과'}  
                - 통과: ${passed} / 실패: ${failed}  
                - 실행 링크: ${{ steps.test-report.outputs.WORKFLOW_URL }}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
                assignees: assignees.length ? assignees : undefined,
              });
            }

  send-email-notification:
    runs-on: ubuntu-latest
    needs: [create-test-report]
    if: always()

    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: ./artifacts

      # Select provider (default: gmail). Set secrets.EMAIL_PROVIDER to choose one of: gmail|outlook|ses|mailgun|sendgrid
      - name: Select email provider
        id: provider
        run: |
          PROVIDER="${{ secrets.EMAIL_PROVIDER }}"
          if [ -z "$PROVIDER" ]; then PROVIDER="gmail"; fi
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT

      # Gmail via SMTP
      - name: Send email via Gmail (SMTP)
        if: steps.provider.outputs.provider == 'gmail'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🤖 AI Project Agent - 자동 테스트 결과 (${{ needs.create-test-report.outputs.BRANCH_NAME }})"
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: ${{ secrets.EMAIL_USERNAME }}
          html_body: |
            <h2>🤖 AI Project Agent 자동 테스트 결과</h2>

            <p><strong>브랜치:</strong> <code>${{ needs.create-test-report.outputs.BRANCH_NAME }}</code></p>
            <p><strong>실행 일시:</strong> ${{ needs.create-test-report.outputs.REPORT_DATE }}</p>
            <p><strong>커밋:</strong> <code>${{ needs.create-test-report.outputs.COMMIT_SHA }}</code></p>

            <h3>📊 테스트 결과</h3>
            <ul>
              <li>✅ <strong>통과:</strong> ${{ needs.create-test-report.outputs.TESTS_PASSED }}개</li>
              <li>❌ <strong>실패:</strong> ${{ needs.create-test-report.outputs.TESTS_FAILED }}개</li>
            </ul>

            <h3>🌐 웹 애플리케이션 테스트</h3>
            <p>웹 애플리케이션의 모든 주요 기능에 대한 E2E 테스트가 완료되었습니다.</p>

            <h3>🔗 관련 링크</h3>
            <ul>
              <li><a href="${{ needs.create-test-report.outputs.WORKFLOW_URL }}">워크플로우 실행 결과</a></li>
              <li><a href="${{ github.server_url }}/${{ github.repository }}">GitHub 저장소</a></li>
            </ul>

            <p>테스트 영상은 첨부파일을 확인해주세요.</p>

            <hr>
            <p><em>이 메일은 자동으로 발송되었습니다.</em></p>
          attachments: |
            artifacts/test-results/**/*.webm
            artifacts/test-results/**/*.png

      # Outlook/Office365 via SMTP
      - name: Send email via Outlook (SMTP)
        if: steps.provider.outputs.provider == 'outlook'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🤖 AI Project Agent - 자동 테스트 결과 (${{ needs.create-test-report.outputs.BRANCH_NAME }})"
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: ${{ secrets.EMAIL_USERNAME }}
          secure: true
          html_body: |
            <h2>🤖 AI Project Agent 자동 테스트 결과</h2>
            <p>Outlook SMTP를 통해 발송되었습니다.</p>
            <p><strong>브랜치:</strong> <code>${{ needs.create-test-report.outputs.BRANCH_NAME }}</code></p>
            <p><strong>실행 일시:</strong> ${{ needs.create-test-report.outputs.REPORT_DATE }}</p>
            <p><strong>커밋:</strong> <code>${{ needs.create-test-report.outputs.COMMIT_SHA }}</code></p>
          attachments: |
            artifacts/test-results/**/*.webm
            artifacts/test-results/**/*.png

      # Amazon SES via SMTP
      - name: Send email via Amazon SES (SMTP)
        if: steps.provider.outputs.provider == 'ses'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SES_SMTP_SERVER }} # email-smtp.<region>.amazonaws.com
          server_port: 587
          username: ${{ secrets.SES_SMTP_USERNAME }}
          password: ${{ secrets.SES_SMTP_PASSWORD }}
          subject: "🤖 AI Project Agent - 자동 테스트 결과 (${{ needs.create-test-report.outputs.BRANCH_NAME }})"
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: ${{ secrets.SES_FROM_ADDRESS }}
          secure: true
          html_body: |
            <h2>🤖 AI Project Agent 자동 테스트 결과</h2>
            <p>Amazon SES를 통해 발송되었습니다.</p>
            <p><strong>브랜치:</strong> <code>${{ needs.create-test-report.outputs.BRANCH_NAME }}</code></p>
            <p><strong>실행 일시:</strong> ${{ needs.create-test-report.outputs.REPORT_DATE }}</p>
            <p><strong>커밋:</strong> <code>${{ needs.create-test-report.outputs.COMMIT_SHA }}</code></p>
          attachments: |
            artifacts/test-results/**/*.webm
            artifacts/test-results/**/*.png

      # Mailgun via API
      - name: Send email via Mailgun (API)
        if: steps.provider.outputs.provider == 'mailgun'
        env:
          MG_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MG_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          TO: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          BODY=$(cat <<'HTML'
          <h2>🤖 AI Project Agent 자동 테스트 결과</h2>
          <p>Mailgun API를 통해 발송되었습니다.</p>
          <p><strong>브랜치:</strong> <code>${{ needs.create-test-report.outputs.BRANCH_NAME }}</code></p>
          <p><strong>실행 일시:</strong> ${{ needs.create-test-report.outputs.REPORT_DATE }}</p>
          <p><strong>커밋:</strong> <code>${{ needs.create-test-report.outputs.COMMIT_SHA }}</code></p>
          HTML
          )
          curl -s --user "api:${MG_API_KEY}" \
            https://api.mailgun.net/v3/${MG_DOMAIN}/messages \
            -F from="AI Project Agent <mailgun@${MG_DOMAIN}>" \
            -F to="${TO}" \
            -F subject="🤖 AI Project Agent - 자동 테스트 결과" \
            -F html="${BODY}"

      # SendGrid via API
      - name: Send email via SendGrid (API)
        if: steps.provider.outputs.provider == 'sendgrid'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          TO: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          BODY=$(cat <<'JSON'
          {
            "personalizations": [{ "to": [ { "email": "${TO}" } ] }],
            "from": { "email": "${FROM_EMAIL}", "name": "AI Project Agent" },
            "subject": "🤖 AI Project Agent - 자동 테스트 결과 (\"${{ needs.create-test-report.outputs.BRANCH_NAME }}\")",
            "content": [ { "type": "text/html", "value": "<h2>🤖 AI Project Agent 자동 테스트 결과</h2><p>SendGrid API를 통해 발송되었습니다.</p><p><strong>브랜치:</strong> <code>${{ needs.create-test-report.outputs.BRANCH_NAME }}</code></p><p><strong>실행 일시:</strong> ${{ needs.create-test-report.outputs.REPORT_DATE }}</p><p><strong>커밋:</strong> <code>${{ needs.create-test-report.outputs.COMMIT_SHA }}</code></p>" } ]
          }
          JSON
          )
          curl -s -X POST \
            -H "Authorization: Bearer ${SENDGRID_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            https://api.sendgrid.com/v3/mail/send
