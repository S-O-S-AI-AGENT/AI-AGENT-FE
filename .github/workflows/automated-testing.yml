name: Automated Testing with TestFlight

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 매일 오전 9시 KST (UTC 0시)에 실행
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  web-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run start &
          sleep 10

      - name: Run E2E tests with video recording
        run: |
          npx playwright test --reporter=html,json --output=test-results
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-videos
          path: test-results/
          retention-days: 30

  ios-testflight-build:
    runs-on: macos-latest
    needs: web-e2e-tests
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup iOS certificates and provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build iOS app (React Native/Capacitor)
        run: |
          # React Native 또는 Capacitor를 사용한 iOS 빌드
          # 실제 프로젝트에 맞게 수정 필요
          echo "Building iOS app..."
          # npx cap build ios --configuration Release

      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # xcrun altool을 사용하여 TestFlight에 업로드
          # 실제 IPA 파일 경로로 수정 필요
          echo "Uploading to TestFlight..."
          # xcrun altool --upload-app --type ios --file "path/to/app.ipa" --username "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"

  create-test-report:
    runs-on: ubuntu-latest
    needs: [web-e2e-tests, ios-testflight-build]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: ./test-results

      - name: Download test videos
        uses: actions/download-artifact@v4
        with:
          name: test-videos
          path: ./test-videos

      - name: Generate test report
        id: test-report
        run: |
          echo "REPORT_DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "WORKFLOW_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT

          # 테스트 결과 파싱
          if [ -f "./test-results/results.json" ]; then
            PASSED=$(jq '.suites[].tests[] | select(.status == "passed") | length' ./test-results/results.json | wc -l)
            FAILED=$(jq '.suites[].tests[] | select(.status == "failed") | length' ./test-results/results.json | wc -l)
            echo "TESTS_PASSED=$PASSED" >> $GITHUB_OUTPUT
            echo "TESTS_FAILED=$FAILED" >> $GITHUB_OUTPUT
          else
            echo "TESTS_PASSED=0" >> $GITHUB_OUTPUT
            echo "TESTS_FAILED=0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Issue for Test Results
        uses: actions/github-script@v7
        with:
          script: |
            const testReport = `
            # 🤖 자동 테스트 결과 리포트

            **실행 일시:** ${{ steps.test-report.outputs.REPORT_DATE }}
            **커밋:** \`${{ steps.test-report.outputs.COMMIT_SHA }}\`
            **워크플로우:** [링크](${{ steps.test-report.outputs.WORKFLOW_URL }})

            ## 📊 테스트 결과
            - ✅ **통과:** ${{ steps.test-report.outputs.TESTS_PASSED }}개
            - ❌ **실패:** ${{ steps.test-report.outputs.TESTS_FAILED }}개

            ## 🎯 TestFlight 배포
            ${context.payload.ref === 'refs/heads/main' ? '✅ TestFlight에 새 빌드가 업로드되었습니다.' : '⏭️ main 브랜치가 아니므로 TestFlight 배포를 건너뛰었습니다.'}

            ## 📹 테스트 영상
            테스트 실행 중 기록된 영상들은 [Artifacts](${{ steps.test-report.outputs.WORKFLOW_URL }})에서 다운로드할 수 있습니다.

            ## 🔗 관련 링크
            - [플레이라이트 리포트](${{ steps.test-report.outputs.WORKFLOW_URL }})
            - [테스트 아티팩트](${{ steps.test-report.outputs.WORKFLOW_URL }})

            ---
            *이 이슈는 자동으로 생성되었습니다.*
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 자동 테스트 결과 - ${new Date().toISOString().split('T')[0]}`,
              body: testReport,
              labels: ['automated-test', 'report']
            });

  send-email-notification:
    runs-on: ubuntu-latest
    needs: [create-test-report]
    if: always()

    steps:
      - name: Download test videos
        uses: actions/download-artifact@v4
        with:
          name: test-videos
          path: ./test-videos

      - name: Send email with test results
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🤖 AI Project Agent - 자동 테스트 결과"
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: ${{ secrets.EMAIL_USERNAME }}
          html_body: |
            <h2>🤖 AI Project Agent 자동 테스트 결과</h2>

            <p><strong>실행 일시:</strong> ${{ steps.test-report.outputs.REPORT_DATE }}</p>
            <p><strong>커밋:</strong> <code>${{ steps.test-report.outputs.COMMIT_SHA }}</code></p>

            <h3>📊 테스트 결과</h3>
            <ul>
              <li>✅ <strong>통과:</strong> ${{ steps.test-report.outputs.TESTS_PASSED }}개</li>
              <li>❌ <strong>실패:</strong> ${{ steps.test-report.outputs.TESTS_FAILED }}개</li>
            </ul>

            <h3>🎯 TestFlight 배포</h3>
            <p>${{ github.ref == 'refs/heads/main' && 'TestFlight에 새 빌드가 업로드되었습니다.' || 'main 브랜치가 아니므로 TestFlight 배포를 건너뛰었습니다.' }}</p>

            <h3>🔗 관련 링크</h3>
            <ul>
              <li><a href="${{ steps.test-report.outputs.WORKFLOW_URL }}">워크플로우 실행 결과</a></li>
              <li><a href="${{ github.server_url }}/${{ github.repository }}">GitHub 저장소</a></li>
            </ul>

            <p>테스트 영상은 첨부파일을 확인해주세요.</p>

            <hr>
            <p><em>이 메일은 자동으로 발송되었습니다.</em></p>
          attachments: ./test-videos/*
